<section class="settings-page">
  <header class="settings-header">
    <p class="section-label">PREFERENCES</p>
    <h1>Settings</h1>
    <p>Customize your hymn book experience.</p>
  </header>

  <div class="settings-card">
    <div class="setting-group">
      <div class="setting-heading">
        <h2>Appearance</h2>
        <p>Choose how the hymn book looks.</p>
      </div>

      <div class="theme-options">
        <button
          type="button"
          class="theme-option"
          [class.active]="theme === 'light'"
          [attr.aria-pressed]="theme === 'light'"
          (click)="changeTheme('light')"
        >
          <span class="theme-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
            </svg>
          </span>
          <strong>Light</strong>
          <small>Bright and clear</small>
        </button>

        <button
          type="button"
          class="theme-option"
          [class.active]="theme === 'dark'"
          [attr.aria-pressed]="theme === 'dark'"
          (click)="changeTheme('dark')"
        >
          <span class="theme-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </span>
          <strong>Dark</strong>
          <small>Easy on the eyes</small>
        </button>

        <button
          type="button"
          class="theme-option"
          [class.active]="theme === 'system'"
          [attr.aria-pressed]="theme === 'system'"
          (click)="changeTheme('system')"
        >
          <span class="theme-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="12" rx="2"></rect>
              <path d="M8 20h8M12 16v4"></path>
            </svg>
          </span>
          <strong>System</strong>
          <small>Match your device</small>
        </button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-heading">
        <h2>Text Size</h2>
        <p>Choose a comfortable reading size.</p>
      </div>

      <div class="text-size-options">
        <button
          type="button"
          [class.active]="textSize === 'small'"
          [attr.aria-pressed]="textSize === 'small'"
          (click)="changeTextSize('small')"
        >
          Small
        </button>

        <button
          type="button"
          [class.active]="textSize === 'medium'"
          [attr.aria-pressed]="textSize === 'medium'"
          (click)="changeTextSize('medium')"
        >
          Medium
        </button>

        <button
          type="button"
          [class.active]="textSize === 'large'"
          [attr.aria-pressed]="textSize === 'large'"
          (click)="changeTextSize('large')"
        >
          Large
        </button>
      </div>
    </div>

    <div class="reset-settings">
      <div>
        <h2>Reset Settings</h2>
        <p>Restore all preferences to their default values.</p>
      </div>

      <button
        type="button"
        class="reset-button"
        (click)="resetSettings()"
      >
        Reset Settings
      </button>
    </div>
  </div>
</section>
