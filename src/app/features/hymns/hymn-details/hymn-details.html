<section class="hymn-details">
    @if (hymn) {
        <p>Hymn {{ hymn.number}}</p>
        <h1>{{ hymn.title }}</h1>
        <p>By {{ hymn.author }}</p>
        <p>{{ hymn.category }}</p>
        <div class="verses">
            @for (verse of hymn.verses; track $index) {
                <p>{{ verse }}</p>
            }
        </div>
        <button (click)="addToFavorites()">Add to Favourites</button>
        <div class="hymn-navigation">
            @if (previousHymn) {
                <a [routerLink]="['/hymns', previousHymn.id]">
                    <- Previous
                </a>
            }
            <br>
            @if (nextHymn) {
                <a [routerLink]="['/hymns', nextHymn.id]">
                    Next ->
                </a>
            }
        </div>
    }
    @else {
        <h1>Hymn not found :)</h1>
        <p>The hymn you are looking for does not exist.</p>
    }
</section>
