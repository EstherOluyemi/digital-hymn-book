<section>
    <h2>Hymn Library</h2>

    <input type="search"
    placeholder="Search hymns...."
    (input)="onSearch($event)">

    <select (change)="onCategoryChange($event)">
        <option value="">All Categories</option>

        @for (category of categories; track category) {
            <option [value]="category">{{ category }}</option>
        }
    </select>

    <select (change)="onSortChange($event)">
        <option value="number">Sort by Number</option>
        <option value="title">Sort by Title</option>
    </select>

    @for (hymn of filteredHymns; track hymn.id) {
        <div>
            <p>Hymn {{ hymn.number }}</p>
            <h2>{{ hymn.title }}</h2>
            <p>{{ hymn.author }}</p>
            <p>{{ hymn.category }}</p>

            <a [routerLink]="['/hymns', hymn.id]">
                Open Hymn
            </a>

            <button
                type="button"
                class="favorite-btn"
                [class.is-favorite]="isFavorite(hymn.id)" //when is true
                (click)="toggleFavorite(hymn)"
                >
                {{ isFavorite(hymn.id) ? 'Remove Favorite' : 'Add Favorite' }}
            </button>
        </div>
    }
    @empty {
        <p>No hymns match your search</p>
    }
</section>
