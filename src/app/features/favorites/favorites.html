<section>
    <h1>My Favourites</h1>

    @for (hymn of favoriteHymns; track hymn.id) {
        <div>
        <p>Hymn {{ hymn.number }}</p>
        <h2>{{ hymn.title }}</h2>
        <p>{{ hymn.author }}</p>

        <a [routerLink]="['/hymns', hymn.id]">Read Hymn</a>
        </div>

        <button type="button" (click)="removeFavorites(hymn.id)">Remove</button>
    }
    @empty {
        <p>You have not added any favourites yet.</p>
    }
</section>
